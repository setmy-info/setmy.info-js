<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Module A demo server</title>
    </head>
    <body>
        <main>
            <h1>Module A web example</h1>
            <p>
                This page is served from <code>packages/a/web</code> by the
                module's own instance (<code
                    >npm run server -w @setmy-info/demo-module-a</code
                >) on the port from its <code>resources/application.yaml</code>.
            </p>
            <p id="message">Loading module-a…</p>
        </main>
        <script type="module">
            import { createMessageFromA } from "./dist/index.min.js";

            document.getElementById("message").textContent =
                createMessageFromA();
        </script>
    </body>
</html>
